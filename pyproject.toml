[build-system]
requires = ["poetry-core<3.0,>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "Mini-AMF"
version = "0.9.3"
description = "AMF serialization and deserialization support for Python"
readme = "README.md"
keywords = ["amf", "amf0", "amf3", "actionscript", "air", "flash", "flashplayer", "bytearray", "recordset", "decoder", "encoder", "sharedobject", "lso", "sol"]
license = "MIT"
authors = [
    {name = "Mini-AMF Project", email = "friedfrogs888@yahoo.com"},
    {name = "Zack Weinberg, The PyAMF Project", email = "zackw@panix.com"},
]
requires-python = ">=3.12,<4.0"
dynamic = ["classifiers"]
dependencies = [
    "defusedxml<0.8,>=0.7.1",
    "setuptools<85,>=84.2.1",
    "six<2,>=1.17",
]
urls.homepage = "https://github.com/zackw/mini-amf"

[dependency-groups]
dev = ["isort<10,>=9.0.2", "mypy[d]<3,>=2.4.1"]

[tool.poetry]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 2.7",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 5 - Production/Stable",
]
packages = [
    {include = "miniamf"},
]
requires-poetry = ">=2.2.1,<3.0.0"
